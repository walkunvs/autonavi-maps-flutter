name: CI

on:
  push:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # iOS Simulator integration tests
  # Captures screenshots that are then committed as the new golden baseline.
  # ───────────────────────────────────────────────────────────────────────────
  integration_test_ios:
    name: Integration Tests (iOS Simulator)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Install Melos
        run: dart pub get && dart run melos bootstrap

      - name: Pod Install
        run: pod install
        working-directory: example/ios

      - name: Create and boot iOS Simulator
        run: |
          RUNTIME=$(xcrun simctl list runtimes --json \
            | python3 -c "
          import sys, json
          runtimes = json.load(sys.stdin)['runtimes']
          ios = [r for r in runtimes if r.get('isAvailable') and 'iOS' in r.get('name','')]
          print(ios[-1]['identifier'] if ios else '')
          ")
          if [ -z "$RUNTIME" ]; then
            echo "No available iOS runtime found" && exit 1
          fi
          UDID=$(xcrun simctl create "IntegrationTestDevice" "iPhone 15" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run integration tests on iOS Simulator
        run: |
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/map_rendering_test.dart \
            --device-id "$SIM_UDID" \
            --dart-define=AMAP_IOS_KEY=${{ secrets.AMAP_IOS_KEY }}
        working-directory: example
        env:
          SIM_UDID: ${{ env.SIM_UDID }}

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-map-screenshots
          path: example/integration_test/screenshots/
          if-no-files-found: warn

      - name: Shutdown simulator
        if: always()
        run: |
          if [ -n "$SIM_UDID" ]; then
            xcrun simctl shutdown "$SIM_UDID" || true
            xcrun simctl delete "$SIM_UDID" || true
          fi
        env:
          SIM_UDID: ${{ env.SIM_UDID }}

  # ───────────────────────────────────────────────────────────────────────────
  # Android Emulator integration tests
  # ───────────────────────────────────────────────────────────────────────────
  integration_test_android:
    name: Integration Tests (Android Emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Install Melos
        run: dart pub get && dart run melos bootstrap

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK (catches Gradle / Kotlin errors before emulator starts)
        working-directory: example
        run: |
          flutter build apk --debug \
            "--dart-define=AMAP_ANDROID_KEY=${{ secrets.AMAP_ANDROID_KEY }}"

      - name: Write Android test runner
        run: |
          cat > /tmp/android_test.sh << 'SCRIPT_EOF'
          #!/bin/sh
          # android-emulator-runner@v2 runs each line of script: as a separate
          # /usr/bin/sh -c invocation — this file runs as a single process so
          # variables and cd changes persist throughout.
          #
          # Screenshot mechanism: the test app writes screenshot_request.txt to
          # its external files dir; this loop detects it, calls adb screencap,
          # then writes screenshot_done.txt so the app can continue.
          PKG_FILES="/sdcard/Android/data/com.example.autonavi_maps_flutter_example/files"
          SCREENSHOTS="$GITHUB_WORKSPACE/example/integration_test/screenshots"
          mkdir -p "$SCREENSHOTS"
          adb logcat -s "ScreenshotChannel" -v time > /tmp/logcat-screenshot.txt &
          LOGCAT_PID=$!
          # Start screenshot monitor in background
          while true; do
            NAME=$(adb shell "cat $PKG_FILES/screenshot_request.txt 2>/dev/null" | tr -d '\r\n ')
            if [ -n "$NAME" ]; then
              adb shell "rm $PKG_FILES/screenshot_request.txt 2>/dev/null" || true
              adb exec-out screencap -p > "$SCREENSHOTS/$NAME.png"
              adb shell "touch $PKG_FILES/screenshot_done.txt" || true
              echo "Captured: $NAME"
            fi
            sleep 0.3
          done &
          MONITOR_PID=$!
          cd "$GITHUB_WORKSPACE/example"
          DRIVE_RESULT=0
          flutter test integration_test/map_rendering_test.dart \
            -d emulator-5554 \
            "--dart-define=AMAP_ANDROID_KEY=${{ secrets.AMAP_ANDROID_KEY }}" \
            || DRIVE_RESULT=$?
          kill $MONITOR_PID 2>/dev/null || true
          kill $LOGCAT_PID  2>/dev/null || true
          exit $DRIVE_RESULT
          SCRIPT_EOF
          chmod +x /tmp/android_test.sh

      - name: Run integration tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          script: /tmp/android_test.sh

      - name: Upload logcat artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: logcat-screenshot-channel
          path: /tmp/logcat-screenshot.txt
          if-no-files-found: ignore

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-map-screenshots
          path: example/integration_test/screenshots/
          if-no-files-found: warn

  # ───────────────────────────────────────────────────────────────────────────
  # Update golden baselines
  #
  # Runs after both integration test jobs complete.  Opens a PR to overwrite
  # the committed goldens with the screenshots from this run.  Using
  # peter-evans/create-pull-request instead of a direct git push so that the
  # update works even when main requires pull requests (branch protection).
  # ───────────────────────────────────────────────────────────────────────────
  update_goldens:
    name: Update Golden Baselines
    runs-on: ubuntu-latest
    needs: [integration_test_ios, integration_test_android]
    if: always()
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Download iOS screenshots
        uses: actions/download-artifact@v4
        with:
          name: ios-map-screenshots
          path: /tmp/ios-screenshots/
        continue-on-error: true

      - name: Download Android screenshots
        uses: actions/download-artifact@v4
        with:
          name: android-map-screenshots
          path: /tmp/android-screenshots/
        continue-on-error: true

      - name: Overwrite goldens
        run: |
          CHANGED=false

          if ls /tmp/ios-screenshots/*.png 2>/dev/null | head -1 > /dev/null; then
            cp /tmp/ios-screenshots/*.png example/integration_test/golden/ios/
            echo "Updated $(ls /tmp/ios-screenshots/*.png | wc -l | tr -d ' ') iOS goldens."
            CHANGED=true
          fi

          if ls /tmp/android-screenshots/*.png 2>/dev/null | head -1 > /dev/null; then
            cp /tmp/android-screenshots/*.png example/integration_test/golden/android/
            echo "Updated $(ls /tmp/android-screenshots/*.png | wc -l | tr -d ' ') Android goldens."
            CHANGED=true
          fi

          echo "CHANGED=$CHANGED" >> "$GITHUB_ENV"

          if [ "$CHANGED" = "false" ]; then
            echo "No screenshots produced — goldens unchanged."
          fi

      - name: Open PR with updated goldens
        if: env.CHANGED == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "ci: update golden baselines [skip ci]"
          branch: ci/golden-baselines
          delete-branch: true
          title: "ci: update golden baselines"
          body: |
            Automated update of golden baseline screenshots from the latest CI run.

            Triggered by: ${{ github.sha }} (`${{ github.ref_name }}`)
          labels: automated,ci
