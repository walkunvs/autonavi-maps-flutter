name: CI

on:
  push:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # iOS Simulator integration tests
  # Captures screenshots that are then committed as the new golden baseline.
  # ───────────────────────────────────────────────────────────────────────────
  integration_test_ios:
    name: Integration Tests (iOS Simulator)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Install Melos
        run: dart pub get && dart run melos bootstrap

      - name: Pod Install
        run: pod install
        working-directory: example/ios

      - name: Create and boot iOS Simulator
        run: |
          RUNTIME=$(xcrun simctl list runtimes --json \
            | python3 -c "
          import sys, json
          runtimes = json.load(sys.stdin)['runtimes']
          ios = [r for r in runtimes if r.get('isAvailable') and 'iOS' in r.get('name','')]
          print(ios[-1]['identifier'] if ios else '')
          ")
          if [ -z "$RUNTIME" ]; then
            echo "No available iOS runtime found" && exit 1
          fi
          UDID=$(xcrun simctl create "IntegrationTestDevice" "iPhone 15" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run integration tests on iOS Simulator
        run: |
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/map_rendering_test.dart \
            --device-id "$SIM_UDID" \
            --dart-define=AMAP_IOS_KEY=${{ secrets.AMAP_IOS_KEY }}
        working-directory: example
        env:
          SIM_UDID: ${{ env.SIM_UDID }}

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-map-screenshots
          path: example/integration_test/screenshots/
          if-no-files-found: warn

      - name: Shutdown simulator
        if: always()
        run: |
          if [ -n "$SIM_UDID" ]; then
            xcrun simctl shutdown "$SIM_UDID" || true
            xcrun simctl delete "$SIM_UDID" || true
          fi
        env:
          SIM_UDID: ${{ env.SIM_UDID }}

  # ───────────────────────────────────────────────────────────────────────────
  # Android build check
  # Verifies the Android example app compiles. Integration tests are not run
  # on CI because map tile rendering is unreliable on emulators (OpenGL ES /
  # network constraints). Run locally with a real device or emulator instead.
  # ───────────────────────────────────────────────────────────────────────────
  build_android:
    name: Build (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Install Melos
        run: dart pub get && dart run melos bootstrap

      - name: Restore fixed CI debug keystore
        run: |
          mkdir -p "$HOME/.android"
          echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}" \
            | base64 -d > "$HOME/.android/debug.keystore"

      - name: Build debug APK
        working-directory: example
        env:
          AMAP_API_KEY: ${{ secrets.AMAP_ANDROID_KEY }}
        run: |
          flutter build apk --debug \
            "--dart-define=AMAP_ANDROID_KEY=${{ secrets.AMAP_ANDROID_KEY }}"

  # ───────────────────────────────────────────────────────────────────────────
  # Update golden baselines (iOS only)
  #
  # Runs after iOS integration tests complete. Opens a PR to overwrite the
  # committed goldens with the screenshots from this run.
  # ───────────────────────────────────────────────────────────────────────────
  update_goldens:
    name: Update Golden Baselines
    runs-on: ubuntu-latest
    needs: [integration_test_ios]
    if: always()
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Download iOS screenshots
        uses: actions/download-artifact@v4
        with:
          name: ios-map-screenshots
          path: /tmp/ios-screenshots/
        continue-on-error: true

      - name: Overwrite goldens
        run: |
          if ls /tmp/ios-screenshots/*.png 2>/dev/null | head -1 > /dev/null; then
            cp /tmp/ios-screenshots/*.png example/integration_test/golden/ios/
            echo "Updated $(ls /tmp/ios-screenshots/*.png | wc -l | tr -d ' ') iOS goldens."
            echo "CHANGED=true" >> "$GITHUB_ENV"
          else
            echo "No iOS screenshots produced — goldens unchanged."
            echo "CHANGED=false" >> "$GITHUB_ENV"
          fi

      - name: Open PR with updated goldens
        if: env.CHANGED == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "ci: update golden baselines [skip ci]"
          branch: ci/golden-baselines
          delete-branch: true
          title: "ci: update golden baselines"
          body: |
            Automated update of iOS golden baseline screenshots from the latest CI run.

            Triggered by: ${{ github.sha }} (`${{ github.ref_name }}`)
          labels: automated,ci
